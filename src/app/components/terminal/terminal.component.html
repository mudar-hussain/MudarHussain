<div class="container-div" id="terminal">
  <div class="term-container" #terminal (click)="focusInput()">
    <app-terminal-nav></app-terminal-nav>
    <div class="terminal">
      <div class="terminal-welcome-messages">
        {{ this.term_welcome_message }}
      </div>
      <app-terminal-output *ngFor="let cmd of output" [terminalUsername]="this.term_username"
        [command]="cmd.command" [response]="cmd.response"></app-terminal-output>
      <div class="terminal-prompt">
        <span class="terminal-username">{{ this.term_username }}
          <input #inputRef type="text" aria-label="input-form" [(ngModel)]="input"
            (keypress)="handleKeyPress($event)" class="input" />
        </span>
      </div>
    </div>
  </div>
</div>
