name: Firebase CI/CD

on:
  push:
    branches:
      - master   # Run only on main branch

jobs:

  # Build Angular App
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18  # Compatible with Angular 16

      - name: Install Dependencies
        run: npm ci

      # Generate environment.prod.ts dynamically
      - name: Generate environment.prod.ts
        run: |
          mkdir -p src/environments
          echo "export const environment = {
            production: true,
            firebaseConfig: {
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}',
              measurementId: '${{ secrets.MEASUREMENT_ID }}'
            }
          };" > src/environments/environment.prod.ts

      - name: Build Angular Production
        run: npm run build -- --configuration production

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Run Tests
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Angular Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

  # Deploy to Firebase Hosting
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]  # Deploy only if build & test pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      # Generate environment.prod.ts again for deploy step
      - name: Generate environment.prod.ts
        run: |
          mkdir -p src/environments
          echo "export const environment = {
            production: true,
            firebaseConfig: {
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}',
              measurementId: '${{ secrets.MEASUREMENT_ID }}'
            }
          };" > src/environments/environment.prod.ts

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v2.2.0
        with:
          args: deploy --only hosting:mudar-hussain
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
